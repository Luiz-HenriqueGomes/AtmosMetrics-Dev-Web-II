# ============================================================
# AtmosMetrics — NGINX Configuration (Production)
# ============================================================
# Serve a SPA React com:
#   • Gzip compression
#   • Cache-Control para assets com hash
#   • Security headers
#   • Proxy reverso para /api → backend
#   • SPA fallback (try_files → index.html)
# ============================================================

# Roda como não-root (user nginx já existe na imagem Alpine)
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ---- Tipos MIME e defaults --------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Performance -----------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ---- Logging compacto ------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ---- Gzip Compression ------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # ---- Temp paths para não-root ----------------------------
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ---- Security Headers --------------------------------
        add_header X-Frame-Options        "SAMEORIGIN"       always;
        add_header X-Content-Type-Options "nosniff"           always;
        add_header X-XSS-Protection       "1; mode=block"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ---- Assets com hash (cache imutável) ----------------
        # Vite gera arquivos como: index-AbC123.js, style-XyZ789.css
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ---- Arquivos estáticos (favicon, etc.) --------------
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|otf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ---- Proxy reverso para API backend ------------------
        location /api/ {
            proxy_pass         http://backend-prod:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts generosos para ETLs longos
            proxy_connect_timeout 60s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # ---- Proxy para documentação Swagger -----------------
        location /docs {
            proxy_pass         http://backend-prod:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /openapi.json {
            proxy_pass         http://backend-prod:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
        }

        # ---- SPA Fallback ------------------------------------
        # Qualquer rota não encontrada retorna index.html
        # para que o React Router / state routing funcione
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- Health check endpoint ---------------------------
        location = /healthz {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
